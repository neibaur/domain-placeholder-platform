name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://example.com
      PUBLIC_SITE_NAME: Domain Placeholder
      PUBLIC_SITE_TITLE: Domain Placeholder
      PUBLIC_SITE_DESCRIPTION: A lightweight placeholder page for a reserved domain.
      PUBLIC_PRIMARY_LOCALE: en
      PUBLIC_SECONDARY_LOCALE: zh-CN
      PUBLIC_ROBOTS_INDEX: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate
        env:
          PA11Y_CHROME_PATH: /usr/bin/google-chrome

      - name: Coverage summary
        run: pnpm test:coverage
